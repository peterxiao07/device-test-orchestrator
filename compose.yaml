name: device-test-orchestrator

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: device_test
      POSTGRES_USER: device_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U device_app -d device_test"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: